<div id="app">

  <section class="screen" id="scr-home"></section>
  <section class="screen" id="scr-quick"></section>
  <section class="screen" id="scr-pass"></section>
  <section class="screen game" id="scr-game">
    <div id="boardWrap">
      <div id="seatBar" role="group" aria-label="Players"></div>
      <canvas id="board" aria-label="Ludo board"></canvas>
      <div id="offlineBadge" class="hidden" role="status"><svg class="ic"><use href="#i-cloud-off"/></svg><span>Offline</span></div>
      <button id="handoffBanner" class="hidden" aria-label="Pass device"></button>
    </div>
    <div id="gameBar">
      <div id="netChip" class="hidden" role="status" aria-label="Connection status"><span class="dot"></span><span id="netChipText">Connected</span></div>
      <div id="turnChip"></div>
      <button id="pauseBtn" aria-label="Pause menu"><svg class="ic"><use href="#i-pause"/></svg></button>
    </div>
    <div id="achHost" aria-live="polite"></div>
    <div id="handoffOverlay" class="overlay hidden"></div>
    <div id="pauseMenu" class="overlay hidden"></div>
  </section>
  <section class="screen" id="scr-end"></section>
  <section class="screen" id="scr-mp"></section>
  <section class="screen" id="scr-room"></section>
  <section class="screen" id="scr-profile"></section>
  <section class="screen" id="scr-daily"></section>
  <section class="screen" id="scr-rules"></section>
  <section class="screen" id="scr-settings"></section>

</div>

<div id="toasts" aria-live="polite"></div>
<div id="sr-live" class="sr-only" role="status" aria-live="polite"></div>

<script src="js/sha.js" defer></script>

<script src="js/qr.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/main.js" defer></script>

</html>
